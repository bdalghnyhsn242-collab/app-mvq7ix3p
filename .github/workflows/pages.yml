name: Deploy game preview to GitHub Pages

on:
  push:
    branches:
      - main
      - build-game-app-LLbPBtxtQCx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      # Enables Pages with the "GitHub Actions" build source automatically,
      # so deploy-pages does not fail with "Get Pages site failed" on repos
      # where Pages was never configured manually.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build (subpath base for GitHub Pages)
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4